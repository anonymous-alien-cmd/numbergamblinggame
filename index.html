<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Gambling Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
    }

    .card {
      width: min(92vw, 480px);
      padding: 24px;
      border-radius: 18px;
      background: rgba(17, 24, 39, 0.9);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      text-align: center;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }

    button {
      background: #f59e0b;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }

    button:hover {
      background: #fbbf24;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #374151;
      min-height: 48px;
    }

    .small {
      font-size: 0.9rem;
      color: #d1d5db;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Number Gambling Game</h1>
    <div class="stat"><span>Balance</span><strong id="balance">1000</strong></div>
    <div class="stat"><span>Round</span><strong id="round">1</strong></div>

    <label for="bet">Bet Amount</label>
    <input id="bet" type="number" min="1" max="1000" value="100" />

    <label for="guess">Guess a number (1-10)</label>
    <input id="guess" type="number" min="1" max="10" value="5" />

    <button id="playBtn">Play</button>
    <div id="message" class="message">Pick a number and place your bet.</div>
    <div class="small">If you guess correctly, you win 2x your bet.</div>
  </div>

  <script>
    const balanceEl = document.getElementById('balance');
    const roundEl = document.getElementById('round');
    const betEl = document.getElementById('bet');
    const guessEl = document.getElementById('guess');
    const playBtn = document.getElementById('playBtn');
    const messageEl = document.getElementById('message');

    let balance = 1000;
    let round = 1;

    function updateUI() {
      balanceEl.textContent = balance;
      roundEl.textContent = round;
    }

    playBtn.addEventListener('click', () => {
      if (balance <= 0) {
        messageEl.textContent = 'You are out of funds. Refresh the page to start over.';
        return;
      }

      const bet = Number(betEl.value);
      const guess = Number(guessEl.value);

      if (!Number.isInteger(bet) || bet < 1 || bet > balance) {
        messageEl.textContent = 'Enter a valid bet amount that does not exceed your balance.';
        return;
      }

      if (!Number.isInteger(guess) || guess < 1 || guess > 10) {
        messageEl.textContent = 'Enter a guess between 1 and 10.';
        return;
      }

      const target = Math.floor(Math.random() * 10) + 1;
      round += 1;

      if (guess === target) {
        balance += bet;
        messageEl.textContent = `Correct! The number was ${target}. You won ${bet}.`;
      } else {
        balance -= bet;
        messageEl.textContent = `Wrong! The number was ${target}. You lost ${bet}.`;
      }

      updateUI();
    });

    updateUI();
  </script>
</body>
</html>
